<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="Zodyvel: Zody mascot and the island">
  <defs>
    <clipPath id="clip"><rect width="960" height="420" rx="26"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0c14"/><stop offset=".6" stop-color="#17133a"/><stop offset="1" stop-color="#0f2a30"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8B7CFF" stop-opacity=".5"/><stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B3A8FF"/><stop offset="1" stop-color="#6FE3CF"/></linearGradient>
    <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a99eff"/><stop offset="1" stop-color="#4f4799"/></linearGradient>
    <radialGradient id="h"><stop offset="0" stop-color="#dcffe9" stop-opacity=".55"/><stop offset=".55" stop-color="#dcffe9" stop-opacity=".16"/><stop offset="1" stop-color="#dcffe9" stop-opacity="0"/></radialGradient>
    <linearGradient id="e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dcffe9"/></linearGradient>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="960" height="420" fill="url(#bg)"/>
    <circle cx="220" cy="210" r="200" fill="url(#glow)"/>
    <g fill="#fff">
      <circle cx="60" cy="56" r="2"><animate attributeName="opacity" values=".15;.9;.15" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="36" r="1.6"><animate attributeName="opacity" values=".9;.2;.9" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="80" r="2.2"><animate attributeName="opacity" values=".2;.9;.2" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="90" cy="372" r="1.8"><animate attributeName="opacity" values=".8;.15;.8" dur="5s" repeatCount="indefinite"/></circle>
    </g>
    <!-- Zody: screen-frame mascot with two glowing pill eyes -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4s" repeatCount="indefinite"/>
      <g transform="translate(220 200) scale(2.5) translate(-50 -50)">
        <rect x="7" y="15" width="86" height="70" rx="15" fill="url(#f)"/>
        <rect x="7.6" y="15.6" width="84.8" height="68.8" rx="14.4" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.2"/>
        <rect x="13.5" y="21.5" width="73" height="57" rx="9.5" fill="#040507"/>
        <circle cx="37" cy="50" r="17" fill="url(#h)"/><circle cx="63" cy="50" r="17" fill="url(#h)"/>
        <rect x="30.5" y="39" width="13" height="22" rx="6.5" fill="url(#e)"><animate attributeName="height" values="22;22;2;22;22" keyTimes="0;.9;.94;.98;1" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="39;39;49;39;39" keyTimes="0;.9;.94;.98;1" dur="5s" repeatCount="indefinite"/></rect>
        <rect x="56.5" y="39" width="13" height="22" rx="6.5" fill="url(#e)"><animate attributeName="height" values="22;22;2;22;22" keyTimes="0;.9;.94;.98;1" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="39;39;49;39;39" keyTimes="0;.9;.94;.98;1" dur="5s" repeatCount="indefinite"/></rect>
        <path d="M18 26 L40 26 L26 46 L18 46 Z" fill="#fff" opacity=".05"/>
      </g>
    </g>
    <ellipse cx="220" cy="350" rx="90" ry="8" fill="#000" opacity=".35"/>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="640" y="82" font-size="52" font-weight="800" fill="url(#title)">Zodyvel</text>
      <text x="640" y="112" font-size="17" fill="#b9b6d9">A tiny island on top of your screen</text>
      <rect x="450" y="138" width="380" height="56" rx="28" fill="#07080e" stroke="#34305c"/>
      <rect x="450" y="138" width="380" height="56" rx="28" fill="url(#glass)"/>
      <circle cx="488" cy="166" r="8" fill="#6FE3CF"><animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="508" y="171" font-size="14" fill="#ecebff" text-anchor="start">Agent working…</text>
      <text x="652" y="171" font-size="14" fill="#b9b6d9" text-anchor="start">♪ playing</text>
      <text x="740" y="171" font-size="14" fill="#b9b6d9" text-anchor="start">CPU 12%</text>
      <rect x="490" y="220" width="300" height="124" rx="24" fill="#07080e" stroke="#34305c"/>
      <rect x="490" y="220" width="300" height="124" rx="24" fill="url(#glass)"/>
      <text x="514" y="250" font-size="16" font-weight="600" fill="#ecebff" text-anchor="start">Approval request</text>
      <text x="514" y="273" font-size="13" fill="#b9b6d9" text-anchor="start">An agent wants to run a tool</text>
      <rect x="514" y="294" width="108" height="32" rx="16" fill="#6FE3CF"/>
      <text x="568" y="315" font-size="14" font-weight="700" fill="#07080e">Approve</text>
      <rect x="636" y="294" width="108" height="32" rx="16" fill="none" stroke="#6a668f"/>
      <text x="690" y="315" font-size="14" fill="#d6d5f2">Deny</text>
      <text x="640" y="389" font-size="14" fill="#8f8cb3">Agents  ·  Music  ·  CPU / RAM / GPU</text>
    </g>
  </g>
</svg>
